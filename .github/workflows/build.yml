name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (Release, AnyCPU)
        run: dotnet build src/ParaDesk.App/ParaDesk.App.csproj -c Release -nologo

      - name: Build (Release, ARM64)
        run: dotnet build src/ParaDesk.App/ParaDesk.App.csproj -c Release -nologo -p:Platform=ARM64

      - name: Self-tests (AnyCPU)
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/ci-selftest.ps1 -Exe src/ParaDesk.App/bin/Release/net48/ParaDesk.exe -ExpectArch x64

      - name: Show paradesk.log
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'ParaDesk\paradesk.log'
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 100 -Encoding utf8 }
          else { Write-Host "no log at $log" }

      - uses: actions/upload-artifact@v4
        with:
          name: ParaDesk-net48-Release
          path: src/ParaDesk.App/bin/Release/net48
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ParaDesk-net48-Release-arm64
          path: src/ParaDesk.App/bin/ARM64/Release/net48
          if-no-files-found: error

  arm64:
    runs-on: windows-11-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (Release, ARM64 and AnyCPU)
        run: |
          dotnet build src/ParaDesk.App/ParaDesk.App.csproj -c Release -nologo -p:Platform=ARM64
          dotnet build src/ParaDesk.App/ParaDesk.App.csproj -c Release -nologo

      - name: Self-tests (ARM64, native)
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/ci-selftest.ps1 -Exe src/ParaDesk.App/bin/ARM64/Release/net48/ParaDesk.exe -ExpectArch arm64

      - name: Self-tests (AnyCPU under x64 emulation)
        shell: pwsh
        timeout-minutes: 10
        run: ./scripts/ci-selftest.ps1 -Exe src/ParaDesk.App/bin/Release/net48/ParaDesk.exe

      - name: Show paradesk.log
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'ParaDesk\paradesk.log'
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 100 -Encoding utf8 }
          else { Write-Host "no log at $log" }
